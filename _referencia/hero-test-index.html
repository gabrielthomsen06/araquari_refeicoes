<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Araquari Refeições · teste da hero</title>
<meta name="description" content="Buffet e marmitas no Condomínio Industrial BHW, BR-101, saída km 59, Araquari/SC. Almoço das 11h às 13h30.">
<link rel="preload" href="../assets/fonts/InstrumentSerif-Regular-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/Geist-Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; font-display: swap;
    src: url(../assets/fonts/InstrumentSerif-Regular-latin.woff2) format("woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; font-display: swap;
    src: url(../assets/fonts/InstrumentSerif-Italic-latin.woff2) format("woff2"); }
  @font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; font-display: swap;
    src: url(../assets/fonts/Geist-Variable-latin.woff2) format("woff2"); }

  :root {
    --ink: #121410; --cream: #F2EDE4; --muted: rgba(242,237,228,.68);
    --green: #66902C; --line: rgba(242,237,228,.38); --accent-text: #E7DCCB;
    --pad: clamp(16px, 4vw, 56px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body { background: #0b0c0a; color: var(--cream); font-family: "Geist", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }

  .hero { position: relative; height: min(100svh, 860px); min-height: 600px; overflow: hidden;
    background: var(--ink); isolation: isolate; }
  /* O vídeo já traz grade, grão, degradês da zona segura e a palavra "No fogo agora". */
  .hero video { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1;
    object-fit: cover; object-position: 72% 50%; background: var(--ink); }
  .hero video.is-mobile { object-position: 50% 20%; }

  .nav { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center;
    justify-content: space-between; padding: 28px var(--pad); font-size: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .02em;
    color: var(--cream); text-decoration: none; }
  .brand img { width: 32px; height: 32px; display: block; }
  .nav ul { display: flex; gap: 32px; list-style: none; color: var(--muted); }
  .nav a { color: inherit; text-decoration: none; }
  .nav ul a:hover { color: var(--cream); }
  .nav .cta { color: var(--cream); border-bottom: 1px solid var(--line); padding-bottom: 3px; }

  .content { position: absolute; left: var(--pad); right: var(--pad); bottom: clamp(32px, 6vh, 64px);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 32px; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 22px; }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .status.is-open::before { background: var(--green); box-shadow: 0 0 0 4px rgba(102,144,44,.22); }
  .status b { color: var(--cream); font-weight: 500; }

  h1 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: clamp(46px, 7.4vw, 112px);
    line-height: .95; letter-spacing: -.02em; max-width: 11ch; text-wrap: balance; }
  h1 em { font-style: italic; color: var(--accent-text); }

  .ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .btn { display: inline-flex; align-items: center; gap: 14px; height: 48px; padding: 0 20px;
    border: 1px solid var(--line); border-radius: 2px; color: var(--cream); text-decoration: none;
    font-size: 15px; font-weight: 500; background: rgba(18,20,16,.25); backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px); transition: background-color .2s ease, border-color .2s ease; }
  .btn span { color: var(--muted); font-weight: 400; }
  .btn:hover { border-color: var(--cream); }
  .btn.primary { background: var(--cream); color: var(--ink); border-color: var(--cream); }
  .btn.primary span { color: #5b5e55; }
  .btn.primary:hover { background: #fff; }
  .btn:focus-visible, .nav a:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }

  .meta { font-size: 13px; line-height: 1.7; color: var(--muted); text-align: right; font-style: normal;
    border-left: 1px solid var(--line); padding-left: 20px; }
  .meta b { color: var(--cream); font-weight: 500; }

  @media (max-width: 820px) {
    .nav ul { display: none; }
    .content { grid-template-columns: 1fr; }
    .meta { display: none; }
    .btn { height: 44px; padding: 0 16px; font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<section class="hero" aria-label="Araquari Refeições">
  <video id="heroVideo" muted loop playsinline preload="metadata" aria-hidden="true"
         poster="../out/hero-poster.jpg"></video>

  <nav class="nav" aria-label="Principal">
    <a class="brand" href="#"><img src="../assets/brand/logo-creme.png" alt="">Araquari Refeições</a>
    <ul>
      <li><a href="#buffet">Buffet</a></li>
      <li><a href="#marmitas">Marmitas</a></li>
      <li><a href="#empresas">Empresas</a></li>
      <li><a class="cta" href="#whatsapp">WhatsApp</a></li>
    </ul>
  </nav>

  <div class="content">
    <div>
      <p class="status" id="status"><b>Aberto agora</b> · até 13h30</p>
      <h1>Almoço de verdade, <em>a dois minutos</em> da sua empresa.</h1>
      <div class="ctas">
        <a class="btn primary" href="#buffet">Buffet <span>R$ 23</span></a>
        <a class="btn" href="#marmitas">Marmita <span>R$ 20</span></a>
        <a class="btn" href="#empresas">Para empresas →</a>
      </div>
    </div>
    <address class="meta"><b>Condomínio Industrial BHW</b><br>BR-101, saída km 59<br>Almoço · 11h às 13h30</address>
  </div>
</section>

<script>
  // Vídeo: master 16:9 em telas largas, recomposto 4:5 em telas estreitas (a palavra fica no topo).
  (function () {
    const v = document.getElementById('heroVideo');
    const narrow = matchMedia('(max-aspect-ratio: 5/4)');
    const still = matchMedia('(prefers-reduced-motion: reduce)');
    const q = new URLSearchParams(location.search);
    function pick() {
      const m = narrow.matches;
      v.classList.toggle('is-mobile', m);
      v.poster = m ? '../out/hero-poster-mobile.jpg' : '../out/hero-poster.jpg';
      v.innerHTML = m
        ? '<source src="../out/hero-mobile.mp4" type="video/mp4">'
        : '<source src="../out/hero-desktop.webm" type="video/webm"><source src="../out/hero-desktop.mp4" type="video/mp4">';
      v.load();
      if (q.has('t')) {                               // ?t=6.1 congela num frame (QA de legibilidade)
        v.addEventListener('loadeddata', () => { v.currentTime = Number(q.get('t')); }, { once: true });
      } else if (!still.matches) {
        v.play().catch(() => {});
      }
    }
    narrow.addEventListener('change', pick);
    pick();
  })();

  // Selo dinâmico pelo horário de Brasília. ?agora=12:10 força um horário (teste).
  (function () {
    const el = document.getElementById('status');
    const q = new URLSearchParams(location.search).get('agora');
    function minutesNow() {
      if (q) { const [h, m] = q.split(':').map(Number); return h * 60 + (m || 0); }
      const p = new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
        .formatToParts(new Date());
      return Number(p.find(x => x.type === 'hour').value) * 60 + Number(p.find(x => x.type === 'minute').value);
    }
    function update() {
      const m = minutesNow(), open = 11 * 60, close = 13 * 60 + 30;
      const isOpen = m >= open && m < close;
      el.classList.toggle('is-open', isOpen);
      el.innerHTML = isOpen ? '<b>Aberto agora</b> · até 13h30'
        : m < open ? '<b>Abre às 11h</b> · almoço até 13h30'
        : '<b>Fechado agora</b> · almoço das 11h às 13h30';
    }
    update();
    if (!q) setInterval(update, 60 * 1000);
  })();
</script>
</body>
</html>
